<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>

  <style type="text/tailwindcss">
    @import "tailwindcss"; 
    /* Esto carga todo el framework */

    /* Variables de configuración */
    @theme {
      --font-sans: "Inclusive Sans", ui-sans-serif, system-ui, sans-serif;
      --color-brand: #ff4500;
    }

    @layer base {
      :root {
        @apply text-sm;
        line-height: 1.5;
      }
      p { @apply mb-1 }

      button {
        @apply rounded-md bg-slate-200 border-1 border-slate-400 px-4 py-1 my-1 text-sm cursor-pointer disabled:opacity-50
      }      
      
      blockquote {
        @apply mx-8 p-2 bg-slate-100
      }

      ol { @apply list-decimal list-outside ml-6 mb-4 }

      ul { @apply list-[circle] list-outside ml-6 mb-4}
      
      kbd, code, a { @apply text-blue-800 }

      a { @apply border-b-1 }

      input, select { @apply border-1 px-2 }

      hr { @apply my-3 }

      td, th { @apply border border-b-blue-200 pl-1.5}
    }
  </style>

  <link rel="shortcut icon" href="./img/rt.ico" type="image/svg">
  <title>Modelo Relacional</title>
</head>

<body class="container mx-auto w-5/6 pb-10">
  <header>
    <h1 class="font-bold text-2xl text-red-700 mb-4">Ejercicio: Modelo Relacional</h1>
  </header>
  <p>Transformar el Diagrama Entidad-Relación del Ejercicio 1 al Modelo Relacional de la Base de Datos de la  <strong>Tienda Virtual</strong>.</p>
  

</body>

</html>
